<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Axxela Multiplayer Trading Table</title>
  <script src="/socket.io/socket.io.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background-color: #0b0312; color: #ffffff; font-family: system-ui, -apple-system, sans-serif; }
    /* Custom scrollbar for trade feed */
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: #140413; }
    ::-webkit-scrollbar-thumb { background: #4a154b; border-radius: 2px; }
  </style>
</head>
<body class="flex flex-col h-screen overflow-hidden">

  <!-- Lobby Overlay -->
  <div id="lobby" class="fixed inset-0 bg-black/90 backdrop-blur-md flex flex-col items-center justify-center z-50">
    <div class="bg-[#260b24] p-8 rounded-2xl border border-pink-900/60 w-80 text-center shadow-2xl">
      <div class="w-12 h-12 bg-pink-900/40 rounded-full flex items-center justify-center mx-auto mb-3 border border-pink-500/30">
        <span class="text-2xl">🎲</span>
      </div>
      <h1 class="text-2xl font-black text-transparent bg-clip-text bg-gradient-to-r from-yellow-400 to-pink-500 mb-1">AXXELA TRADING</h1>
      <p class="text-xs text-pink-300/60 mb-6 uppercase tracking-widest font-semibold">Live Pit Market Game</p>
      
      <input id="inpName" type="text" placeholder="Your Name" class="w-full p-2.5 mb-3 bg-[#140413] border border-pink-950 rounded-lg text-white text-center outline-none focus:border-pink-500 transition">
      <input id="inpRoom" type="text" placeholder="Room Code (e.g. PIT1)" class="w-full p-2.5 mb-5 bg-[#140413] border border-pink-950 rounded-lg text-white text-center outline-none focus:border-pink-500 transition">
      
      <button onclick="joinGame()" class="w-full py-3 bg-gradient-to-r from-pink-700 to-purple-800 hover:from-pink-600 hover:to-purple-700 font-bold rounded-lg shadow-lg active:scale-95 transition">Join Trading Table</button>
    </div>
  </div>

  <!-- Header Bar -->
  <header class="flex justify-between items-center px-6 py-3 bg-[#140413] border-b border-pink-950/60 shadow-md">
    <div class="flex items-center gap-3">
      <span class="px-2.5 py-1 bg-pink-950/60 border border-pink-800/40 rounded text-xs font-bold text-pink-300 uppercase tracking-wider">Axxela Pit</span>
      <div id="lblRound" class="text-lg font-black text-white">Round 1</div>
    </div>
    <div id="lblSeat" class="text-sm font-bold text-yellow-400 bg-yellow-400/10 px-3 py-1 rounded-full border border-yellow-500/20">Seat: Unassigned</div>
    <div class="flex items-center gap-2">
      <span class="text-xs text-gray-400 uppercase font-bold">Time Remaining</span>
      <div id="lblTimer" class="text-xl font-mono font-bold text-emerald-400 bg-emerald-950/40 px-3 py-0.5 rounded border border-emerald-800/40">01:30</div>
    </div>
  </header>

  <!-- Main Game Dashboard -->
  <div class="flex flex-1 overflow-hidden">
    <!-- Left: Interactive Oval Casino Table Canvas -->
    <div class="flex-1 flex flex-col items-center justify-center p-4 relative">
      <canvas id="tableCanvas" width="760" height="460" class="max-w-full max-h-full cursor-pointer"></canvas>
      <div class="absolute bottom-2 text-center text-xs text-gray-500 pointer-events-none">
        💡 Click on another player's <span class="text-green-400 font-bold">BUY</span> or <span class="text-red-400 font-bold">SELL</span> quote to instantly execute a trade.
      </div>
    </div>

    <!-- Right: Order Desk & Execution Logs -->
    <div class="w-80 bg-[#1c071b] border-l border-pink-950/60 p-4 flex flex-col gap-4 overflow-y-auto">
      
      <!-- User Position & PnL Header Stats -->
      <div class="grid grid-cols-2 gap-2 text-center">
        <div class="bg-[#10030f] p-2.5 rounded-lg border border-pink-950">
          <div class="text-[10px] text-gray-400 uppercase tracking-wider font-bold">Your Realized P/L</div>
          <div id="boxPnl" class="text-base font-black text-yellow-400">₹0</div>
        </div>
        <div class="bg-[#10030f] p-2.5 rounded-lg border border-pink-950">
          <div class="text-[10px] text-gray-400 uppercase tracking-wider font-bold">Current Position</div>
          <div id="boxPos" class="text-base font-black text-white">0</div>
        </div>
      </div>

      <!-- Post Market Quote Form (BUY / SELL) -->
      <div class="bg-[#10030f] p-3.5 rounded-xl border border-pink-900/40 shadow-inner">
        <div class="text-[11px] text-pink-300/80 mb-2.5 font-bold text-center tracking-wider uppercase">Post Market Quotes</div>
        <div class="flex gap-2 mb-3">
          <div class="flex-1">
            <label class="block text-[10px] text-green-400 mb-1 font-bold">BUY PRICE</label>
            <input id="inpBuy" type="number" placeholder="0" class="w-full p-2 bg-black/60 text-green-400 font-mono font-bold text-center text-sm border border-green-900/60 rounded-lg outline-none focus:border-green-500">
          </div>
          <div class="flex-1">
            <label class="block text-[10px] text-red-400 mb-1 font-bold">SELL PRICE</label>
            <input id="inpSell" type="number" placeholder="0" class="w-full p-2 bg-black/60 text-red-400 font-mono font-bold text-center text-sm border border-red-900/60 rounded-lg outline-none focus:border-red-500">
          </div>
        </div>
        <button onclick="sendQuote()" class="w-full py-2 bg-gradient-to-r from-pink-800 to-purple-800 hover:from-pink-700 hover:to-purple-700 text-white font-bold text-xs rounded-lg shadow uppercase tracking-wider transition active:scale-95">Broadcast Quotes</button>
      </div>

      <!-- Real-Time Pit Trades Feed -->
      <div class="flex-1 flex flex-col min-h-[140px]">
        <div class="text-[11px] font-bold text-gray-400 mb-1.5 uppercase tracking-wider flex justify-between items-center">
          <span>Pit Trades Feed</span>
          <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
        </div>
        <div id="tradeLog" class="flex-1 bg-[#10030f] p-2.5 rounded-xl text-xs font-mono border border-pink-950/60 overflow-y-auto flex flex-col gap-1.5"></div>
      </div>

      <!-- Live Pit Leaderboard -->
      <div>
        <div class="text-[11px] font-bold text-yellow-500/80 mb-1.5 uppercase tracking-wider">Live Leaderboard</div>
        <div id="leaderboard" class="bg-[#10030f] p-2.5 rounded-xl text-xs font-mono border border-pink-950/60 flex flex-col gap-1.5"></div>
      </div>
    </div>
  </div>

  <script>
    const socket = io();
    let mySeat = null;
    let gameState = { seats: {}, offers: {}, trades: [], pnls: {}, positions: {}, revealedDigits: [], currentRound: 1 };
    
    const canvas = document.getElementById('tableCanvas');
    const ctx = canvas.getContext('2d');
    
    let hoverState = { seat: null, type: null }; // Tracks mouse position for active hover states

    function joinGame() {
      const playerName = document.getElementById('inpName').value.trim();
      const roomId = document.getElementById('inpRoom').value.trim();
      if (!playerName || !roomId) return alert('Please enter both your name and a room code!');
      
      socket.emit('joinRoom', { roomId, playerName });
    }

    socket.on('initPlayer', (data) => {
      mySeat = data.seat;
      document.getElementById('lblSeat').innerText = `Seat: ${mySeat}`;
      if (data.currentRound) {
        document.getElementById('lblRound').innerText = `Round ${data.currentRound}`;
      }
      document.getElementById('lobby').classList.add('hidden');
    });

    socket.on('errorMsg', (msg) => alert(msg));

    socket.on('timerUpdate', (timeSec) => {
      const m = String(Math.floor(timeSec / 60)).padStart(2, '0');
      const s = String(timeSec % 60).padStart(2, '0');
      document.getElementById('lblTimer').innerText = `${m}:${s}`;
    });

    socket.on('roundAdvance', (data) => {
      if (data.currentRound) {
        document.getElementById('lblRound').innerText = `Round ${data.currentRound}`;
      }
    });

    socket.on('stateUpdate', (state) => {
      gameState = state;
      updateUI();
      drawTable();
    });

    function sendQuote() {
      const buy = document.getElementById('inpBuy').value;
      const sell = document.getElementById('inpSell').value;
      if (buy || sell) {
        socket.emit('postOffer', { buy, sell });
      }
    }

    function updateUI() {
      if (gameState.currentRound) {
        document.getElementById('lblRound').innerText = `Round ${gameState.currentRound}`;
      }

      if (mySeat) {
        const pnl = gameState.pnls[mySeat] || 0;
        const pnlEl = document.getElementById('boxPnl');
        pnlEl.innerText = `₹${pnl}`;
        pnlEl.className = `text-base font-black ${pnl > 0 ? 'text-green-400' : pnl < 0 ? 'text-red-400' : 'text-yellow-400'}`;

        document.getElementById('boxPos').innerText = gameState.positions[mySeat] || 0;
      }

      // Trades Log Feed
      const logBox = document.getElementById('tradeLog');
      logBox.innerHTML = gameState.trades.map(t => 
        `<div class="bg-[#170516] p-1.5 rounded border border-pink-950/40 text-[11px] leading-tight">
          <div class="text-gray-400 text-[9px] mb-0.5">${t.time || ''}</div>
          <div><b class="text-green-400">${t.buyer}</b> bought from <b class="text-red-400">${t.seller}</b> @ <span class="text-yellow-400 font-bold">₹${t.price}</span></div>
         </div>`
      ).reverse().join('');

      // Leaderboard
      const lbBox = document.getElementById('leaderboard');
      const sorted = Object.keys(gameState.pnls).sort((a,b) => gameState.pnls[b] - gameState.pnls[a]);
      lbBox.innerHTML = sorted.map((seat, i) => {
        const name = gameState.seats[seat]?.name || 'Empty';
        const pnl = gameState.pnls[seat] || 0;
        const color = pnl > 0 ? 'text-green-400' : pnl < 0 ? 'text-red-400' : 'text-gray-400';
        return `<div class="flex justify-between items-center p-1 rounded ${seat === mySeat ? 'bg-pink-950/30 font-bold' : ''}">
                  <span class="text-gray-300">#${i+1} ${seat} <span class="text-gray-500">(${name})</span></span>
                  <span class="font-bold ${color}">₹${pnl}</span>
                </div>`;
      }).join('');
    }

    // Seat Coordinate Definitions for Casino Layout
    const cx = 380;
    const cy = 220;
    const seats = {
      A: { x: cx, y: cy + 165, ox: 0, oy: 35 },
      F: { x: cx - 250, y: cy + 70, ox: -20, oy: 35 },
      E: { x: cx - 200, y: cy - 115, ox: -20, oy: -35 },
      D: { x: cx, y: cy - 145, ox: 0, oy: -35 },
      C: { x: cx + 200, y: cy - 115, ox: 20, oy: -35 },
      B: { x: cx + 250, y: cy + 70, ox: 20, oy: 35 }
    };

    // Canvas Mouse Interaction for Direct Trades
    canvas.onmousemove = (e) => {
      const rect = canvas.getBoundingClientRect();
      const mx = e.clientX - rect.left;
      const my = e.clientY - rect.top;

      let foundHover = false;

      Object.keys(seats).forEach(seat => {
        if (seat === mySeat) return;
        const offer = gameState.offers[seat];
        if (!offer) return;

        const pos = seats[seat];
        const bx = pos.x + pos.ox;
        const by = pos.y + pos.oy;

        // Check BUY quote click area (Green Badge)
        if (offer.buy && mx >= bx - 40 && mx <= bx + 40 && my >= by - 26 && my <= by - 2) {
          hoverState = { seat, type: 'BUY' };
          foundHover = true;
        }
        // Check SELL quote click area (Red Badge)
        if (offer.sell && mx >= bx - 40 && mx <= bx + 40 && my >= by + 2 && my <= by + 26) {
          hoverState = { seat, type: 'SELL' };
          foundHover = true;
        }
      });

      if (!foundHover) hoverState = { seat: null, type: null };
      drawTable();
    };

    canvas.onclick = () => {
      if (!hoverState.seat || !hoverState.type) return;

      // When you click another player's quote:
      // - Hovering their BUY quote means you want to SELL to them
      // - Hovering their SELL quote means you want to BUY from them
      const action = hoverState.type === 'BUY' ? 'SELL' : 'BUY';
      socket.emit('executeDirectTrade', { targetSeat: hoverState.seat, action });
    };

    // Canvas Visual Rendering Engine
    function drawTable() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Outer Glow & Felt Border
      ctx.beginPath();
      ctx.ellipse(cx, cy, 290, 160, 0, 0, 2 * Math.PI);
      ctx.fillStyle = '#1c051a';
      ctx.fill();

      // Outer Felt Rim
      ctx.beginPath();
      ctx.ellipse(cx, cy, 280, 150, 0, 0, 2 * Math.PI);
      ctx.fillStyle = '#2d0928';
      ctx.fill();
      ctx.lineWidth = 6;
      ctx.strokeStyle = '#631343';
      ctx.stroke();

      // Inner Table Felt
      ctx.beginPath();
      ctx.ellipse(cx, cy, 260, 130, 0, 0, 2 * Math.PI);
      ctx.fillStyle = '#3f0c38';
      ctx.fill();
      ctx.lineWidth = 2;
      ctx.strokeStyle = '#8a235f';
      ctx.stroke();

      // Center Digit Cards Display Area
      const cardStartX = cx - 135;
      for (let i = 0; i < 6; i++) {
        const x = cardStartX + (i * 45);
        const y = cy - 30;
        const val = gameState.revealedDigits[i] !== undefined ? gameState.revealedDigits[i] : null;

        // Card Shadow/Slot
        ctx.fillStyle = '#1e051b';
        ctx.fillRect(x, y, 38, 60);

        if (val !== null) {
          // Card Front
          ctx.fillStyle = '#ffffff';
          ctx.fillRect(x - 2, y - 2, 38, 60);
          ctx.lineWidth = 2;
          ctx.strokeStyle = '#e2e8f0';
          ctx.strokeRect(x - 2, y - 2, 38, 60);

          ctx.fillStyle = '#0f172a';
          ctx.font = 'bold 24px monospace';
          ctx.fillText(val, x + 10, y + 36);
        } else {
          // Card Back Design
          ctx.strokeStyle = '#5a1240';
          ctx.lineWidth = 1.5;
          ctx.strokeRect(x, y, 38, 60);
          ctx.fillStyle = '#33082b';
          ctx.fillText('?', x + 12, y + 36);
        }
      }

      // Render Seats & Live Quote Badges
      Object.keys(seats).forEach(seat => {
        const pos = seats[seat];
        const isMe = seat === mySeat;
        const pData = gameState.seats[seat];

        // Player Circle Node
        ctx.beginPath();
        ctx.arc(pos.x, pos.y, 22, 0, 2 * Math.PI);
        ctx.fillStyle = isMe ? '#10b981' : (pData ? '#3b82f6' : '#334155');
        ctx.fill();
        ctx.lineWidth = 3;
        ctx.strokeStyle = isMe ? '#6ee7b7' : (pData ? '#93c5fd' : '#64748b');
        ctx.stroke();

        // Seat Label & Name
        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 13px sans-serif';
        ctx.fillText(seat, pos.x - 5, pos.y + 4);

        if (pData) {
          ctx.fillStyle = '#cbd5e1';
          ctx.font = '10px sans-serif';
          ctx.fillText(pData.name.substring(0, 8), pos.x - 20, pos.y + 34);
        }

        // Render Live BUY / SELL Market Badges
        const offer = gameState.offers[seat];
        if (offer) {
          const bx = pos.x + pos.ox;
          const by = pos.y + pos.oy;

          // BUY Quote Badge (Green)
          if (offer.buy) {
            const isHovered = hoverState.seat === seat && hoverState.type === 'BUY';
            ctx.fillStyle = isHovered ? '#166534' : '#052e16';
            ctx.fillRect(bx - 40, by - 26, 80, 22);
            ctx.lineWidth = isHovered ? 2 : 1;
            ctx.strokeStyle = isHovered ? '#4ade80' : '#22c55e';
            ctx.strokeRect(bx - 40, by - 26, 80, 22);

            ctx.fillStyle = '#4ade80';
            ctx.font = 'bold 10px sans-serif';
            ctx.fillText(`BUY @ ₹${offer.buy}`, bx - 32, by - 11);
          }

          // SELL Quote Badge (Red)
          if (offer.sell) {
            const isHovered = hoverState.seat === seat && hoverState.type === 'SELL';
            ctx.fillStyle = isHovered ? '#991b1b' : '#450a0a';
            ctx.fillRect(bx - 40, by + 2, 80, 22);
            ctx.lineWidth = isHovered ? 2 : 1;
            ctx.strokeStyle = isHovered ? '#f87171' : '#ef4444';
            ctx.strokeRect(bx - 40, by + 2, 80, 22);

            ctx.fillStyle = '#f87171';
            ctx.font = 'bold 10px sans-serif';
            ctx.fillText(`SELL @ ₹${offer.sell}`, bx - 32, by + 17);
          }
        }
      });
    }

    // Initial render
    drawTable();
  </script>
</body>
</html>
